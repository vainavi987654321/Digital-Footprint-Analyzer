<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Footprint Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Digital Footprint Analyzer</h1>

        <p>
            Upload a digital profile and let AI analyze its privacy risk.
        </p>

        <input type="file" id="imageInput" accept="image/*">

        <br><br>

        <img id="preview" width="300" style="display:none;">

        <br><br>

        <button id="analyzeBtn" disabled>
            Analyze Image
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
